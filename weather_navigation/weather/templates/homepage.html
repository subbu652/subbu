<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Navigation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('https://images.twnmm.com/c55i45ef3o2a/6XweKkenBWsK2bEgUBxotE/1151257e237f4cb334f154043b3c9fdc/FALL_STORMS_02.jpg?fm=webp&q=80&w=3840');
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 10px;
            color: white;
        }
        .container h1 {
            margin-bottom: 25px;
        }
        .links a {
            display: inline-block;
            margin: 10px 20px;
            padding: 15px 25px;
            color: white;
            text-decoration: none;
            background: #007BFF;
            border-radius: 5px;
            transition: 0.5s;
        }
        .links a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Weather Navigation</h1>
        <div class="links">
            <a href="{% url 'signup' %}">Sign Up</a>
            <a href="{% url 'signin' %}">Sign In</a>
        </div>
    </div>
</body>
</html>
